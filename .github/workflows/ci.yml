name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose --profile test build
      - name: Install Bitrix and start the stack
        run: docker compose up -d
      - name: Audit, static analysis and tests
        run: >-
          docker compose --profile test run --rm tests sh -c
          'composer audit && vendor/bin/php-cs-fixer check && vendor/bin/phpstan analyse --no-progress && vendor/bin/phpunit'
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

  deploy:
    needs: [frontend, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, notes]
    timeout-minutes: 30
    concurrency:
      group: deploy
      cancel-in-progress: false
    defaults:
      run:
        # A clone of the repository with .env.
        working-directory: /home/crm/notes
    steps:
      - name: Check out the commit
        run: |
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --force --detach FETCH_HEAD
      - name: Start the new version
        run: docker compose up -d --build --remove-orphans
      - name: Smoke test
        run: |
          . ./.env
          for _ in $(seq 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:${NOTES_HTTP_PORT}/api/notes?limit=1" && exit 0
            sleep 2
          done
          docker compose logs --no-color --tail 100
          exit 1
      - name: Remove dangling images
        run: docker image prune -f
