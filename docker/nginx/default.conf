server_tokens off;

# Behind the reverse proxy the client address comes in X-Real-IP.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Real-IP;

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 8080;
    server_name _;
    root /srv/notes;
    index index.html;

    # The container port differs from the public one behind the reverse proxy.
    absolute_redirect off;
    client_max_body_size 64k;

    gzip on;
    gzip_types text/css application/javascript application/json application/problem+json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Only the API reaches PHP; the Bitrix core, admin panel and module sources are not served.
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;
        error_page 413 @payload_too_large;
        error_page 429 @too_many_requests;
        # Failures of the Bitrix kernel or of php-fpm itself come as HTML pages.
        fastcgi_intercept_errors on;
        error_page 500 @server_error;
        error_page 502 503 504 =503 @unavailable;
        fastcgi_connect_timeout 5s;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/bitrix/routing_index.php;
        fastcgi_param SCRIPT_NAME /bitrix/routing_index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html;
        fastcgi_hide_header X-Powered-CMS;
        fastcgi_pass php:9000;
    }

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Content Too Large","status":413}';
    }

    location @too_many_requests {
        default_type application/problem+json;
        return 429 '{"type":"about:blank","title":"Too Many Requests","status":429}';
    }

    location @server_error {
        default_type application/problem+json;
        return 500 '{"type":"about:blank","title":"Internal Server Error","status":500}';
    }

    location @unavailable {
        default_type application/problem+json;
        return 503 '{"type":"about:blank","title":"Service Unavailable","status":503}';
    }
}
