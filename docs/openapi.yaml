openapi: 3.0.3
info:
  title: Notes API
  version: 1.0.0
  description: |
    REST API мини-сервиса заметок. Авторизации нет.
    Тело запросов и ответов — JSON. Ошибки возвращаются в формате RFC 9457 (`application/problem+json`).
servers:
  - url: /api
tags:
  - name: notes
paths:
  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Список заметок, новые первыми
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Страница списка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [notes]
      operationId: createNote
      summary: Создать заметку
      requestBody:
        $ref: '#/components/requestBodies/NoteInput'
      responses:
        '201':
          description: Заметка создана
          headers:
            Location:
              description: Адрес созданной заметки
              schema:
                type: string
                example: /api/notes/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /notes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [notes]
      operationId: getNote
      summary: Заметка целиком
      responses:
        '200':
          description: Заметка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    put:
      tags: [notes]
      operationId: updateNote
      summary: Изменить заметку
      requestBody:
        $ref: '#/components/requestBodies/NoteInput'
      responses:
        '200':
          description: Заметка изменена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [notes]
      operationId: deleteNote
      summary: Удалить заметку
      responses:
        '204':
          description: Заметка удалена
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  requestBodies:
    NoteInput:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoteInput'
  responses:
    BadRequest:
      description: Тело запроса не является JSON-объектом
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Заметка не найдена
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Тело запроса передано не как application/json
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ValidationFailed:
      description: Данные не прошли проверку
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
  schemas:
    NoteInput:
      type: object
      additionalProperties: false
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
          description: Пробелы по краям обрезаются, после этого заголовок не может быть пустым
        content:
          type: string
          maxLength: 10000
    NoteSummary:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteSummary'
        - type: object
          required: [content]
          properties:
            content:
              type: string
    NotePage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NoteSummary'
        hasMore:
          type: boolean
          description: Есть ли заметки после этой страницы
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
          example: Not Found
        status:
          type: integer
          example: 404
        detail:
          type: string
          example: Заметка не найдена
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              description: Сообщение об ошибке для каждого неверного поля
              additionalProperties:
                type: string
              example:
                title: Введите заголовок
